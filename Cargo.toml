[package]
name = "dwm_status"
version = "0.1.0"
description = "An event-driven X11 root-window status feeder for dwm"
repository = "https://github.com/euvoor/dwm-status"
license = "MIT"
readme = "README.md"
keywords = ["dwm", "x11", "linux", "status-bar", "suckless"]
categories = ["command-line-utilities"]
rust-version = "1.85"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.53.1", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1.92"
chrono = "0.4.45"
chrono-tz = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
x11rb = "0.14.0"
futures-util = "0.3.34"
rtnetlink = "0.22.0"
