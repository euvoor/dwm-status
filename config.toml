features = [
  "date_time",
  "connectivity",
  "memory",
  "cpu",
  "gpu",
  "net_stats",
]

[connectivity]
prefix = ""
idle = 1
format = "compact"
show_iface = true
show_route = true
show_dns = true
show_kind = true

[memory]
prefix = ""
idle = 1
output = "used"

[date_time]
prefix = ""
idle = 1
format = "%a %d %b %Y %X %Z"

[cpu]
prefix = ""
idle = 1
chip = "k10temp-pci-00c3"
report = "Tctl"

[gpu]
prefix = ""
idle = 1

[net_stats]
prefix = ""
idle = 1
ifaces = [
  "enp10s0",
  "wlx04d4c464bd3c",
]
