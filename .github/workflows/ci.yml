name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Rust 1.85 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # v7.0.1: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Test on the minimum Rust version
        run: cargo +1.85.0 test --locked --all-targets

      - name: Build release on the minimum Rust version
        run: cargo +1.85.0 build --locked --release

  quality:
    name: Test, lint, build, and X11 smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # v7.0.1: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Use stable Rust
        run: rustup default stable

      - name: Test
        run: cargo test --locked --all-targets

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release

      - name: Verify isolated install behavior
        run: ./scripts/install-smoke.sh

      - name: Verify isolated reinstall behavior
        run: ./scripts/reinstall-smoke.sh

      - name: Install runtime smoke dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends iproute2 util-linux xvfb x11-utils

      - name: Verify X11 root properties
        run: ./scripts/xvfb-smoke.sh

      - name: Verify passive netlink wakeups
        run: ./scripts/netlink-smoke.sh

  audit:
    name: RustSec audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # v7.0.1: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --no-default-features --version 0.22.2

      - name: Audit lockfile
        run: cargo audit
